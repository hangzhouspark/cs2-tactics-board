<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="smokeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FC"/>
      <stop offset="1" stop-color="#9EAFC0"/>
    </linearGradient>
  </defs>
  <!-- 描边层：三个圆叠成整体轮廓 -->
  <g fill="#1B2027" stroke="#1B2027" stroke-width="7" stroke-linejoin="round">
    <circle cx="23" cy="36" r="13"/>
    <circle cx="41" cy="36" r="13"/>
    <circle cx="32" cy="23" r="14"/>
  </g>
  <!-- 填充层：覆盖内部描边，得到干净剪影 -->
  <g fill="url(#smokeFill)">
    <circle cx="23" cy="36" r="13"/>
    <circle cx="41" cy="36" r="13"/>
    <circle cx="32" cy="23" r="14"/>
  </g>
</svg>
